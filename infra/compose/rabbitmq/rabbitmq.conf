# RabbitMQ configuration for local dev
# In production, use TLS and quorum queues (see infra/rabbitmq/)

## Logging
log.console = true
log.console.level = info

## Management plugin
management.tcp.port = 15672
management.load_definitions = /etc/rabbitmq/definitions.json

## Heartbeat
heartbeat = 60

## Max message size (10 MB)
max_message_size = 10485760
